name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Accept Licenses & Install Required SDKs and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "platforms;android-29" "platforms;android-30" "ndk;21.4.7075529"
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          set -e -o pipefail
          ./gradlew :app:assembleBlackBox64Debug :app:assembleBlackBox32Debug --stacktrace 2>&1 | tee build_output.log
          echo "### Generated APK files:"
          find app/build/outputs -name "*.apk" -ls

      - name: Push failure log to git branch if failed
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          tail -n 300 build_output.log > BUILD_ERROR.txt
          git add BUILD_ERROR.txt
          git commit -m "Auto-commit build error log [skip ci]"
          git push -f origin build-log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-LOCATION-APKs
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.1.0-zero
          name: ZERO LOCATION v2.1.0
          body: "Official APK build for ZERO LOCATION"
          files: app/build/outputs/apk/**/*.apk
